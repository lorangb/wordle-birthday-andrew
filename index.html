  .tile.filled{border-color:#878A8C;animation:pop .12s ease}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  .tile.correct{background:#6AAA64;border-color:#6AAA64;color:#fff}
  .tile.present{background:#C9B458;border-color:#C9B458;color:#fff}
  .tile.absent{background:#787C7E;border-color:#787C7E;color:#fff}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .tile.flip{animation:flip .4s ease forwards}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .tile.bounce{animation:bounce .2s ease 3}
  .kb{margin:8px 0;width:min(480px,95vw)}
  .kb-r{display:flex;gap:3px;justify-content:center;margin-bottom:3px}

  .k.wide{flex:1.5;font-size:0.65rem}
  .k.spacer{flex:0.5;background:transparent;pointer-events:none}
  .k.correct{background:#6AAA64;color:#fff}
  .k.present{background:#C9B458;color:#fff}
  .k.absent{background:#787C7E;color:#fff}

  .msg.ok{color:#6AAA64;font-family:'Instrument Serif',Georgia,serif;font-size:1rem}

// ---------------------------------------------------------------------------
// GAME STATE
// ---------------------------------------------------------------------------
const N = 6, L = 5;
let cur = 0, row = 0, guess = '', done = false;
let state = [];
let shakeTimer = null;

function loadGame() {
  try {
    const s = localStorage.getItem('wordle-andrew');
    if (s) {
      const d = JSON.parse(s);
      if (d.v === 1 && d.state && d.state.length === ANSWERS.length) {
        state = d.state;
        return true;
      }
    }
  } catch(e) {}
  return false;
}

function saveGame() {
  try { localStorage.setItem('wordle-andrew', JSON.stringify({v:1,state})); } catch(e) {}
}

function initGame() {
  state = ANSWERS.map(() => ({
    solved: false, lost: false,
    guesses: [],
    results: [],
    kb: {}
  }));
}

// Build board
function build() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  for (let r = 0; r < N; r++) {
    const row = document.createElement('div');
    row.className = 'row'; row.id = `r${r}`;
    for (let c = 0; c < L; c++) {
      const t = document.createElement('div');
      t.className = 'tile'; t.id = `t${r}${c}`;
      row.appendChild(t);
    }
    b.appendChild(row);
  }
}

function render() {
  const s = state[cur];
  const w = ANSWERS[cur];

  document.getElementById('pnum').textContent = `Puzzle ${cur+1} of ${ANSWERS.length}`;
  document.getElementById('pclue').textContent = CLUES[cur];

  // Reset game-level vars for THIS puzzle
  done = s.solved || s.lost;

  // Clear board
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < L; c++) {
      const t = document.getElementById(`t${r}${c}`);
      t.textContent = ''; t.className = 'tile';
    }
  }

  // Render past guesses
  for (let g = 0; g < s.guesses.length; g++) {
    const gs = s.guesses[g];
    const rs = s.results[g];
    for (let c = 0; c < L; c++) {
      const t = document.getElementById(`t${g}${c}`);
      t.textContent = gs[c];
      t.className = `tile ${rs[c]} filled`;
    }
  }

  // Current row
  row = s.guesses.length;
  if (!s.solved && !s.lost && guess) {
    for (let c = 0; c < guess.length && c < L; c++) {
      const t = document.getElementById(`t${row}${c}`);
      t.textContent = guess[c];
      t.className = 'tile filled';
    }
  }

  // Message
  const msg = document.getElementById('msg');
  if (s.solved) msg.innerHTML = '&#127942; Solved!'; else if (s.lost) msg.innerHTML = '&#128077; ' + w; else msg.innerHTML = '&nbsp;';

  renderKB();
  upPB();
  upStats();
  disKeys();
  upNav();
}

function renderKB() {
  const s = state[cur];
  document.querySelectorAll('.k').forEach(k => {
    const l = k.dataset.k;
    if (!l) return;
    k.className = 'k' + (l === 'enter' || l === 'del' ? ' wide' : '');
    if (s.kb[l] === 'c') k.classList.add('correct');
    else if (s.kb[l] === 'p') k.classList.add('present');
    else if (s.kb[l] === 'a') k.classList.add('absent');
  });
}

function disKeys() {
  const s = state[cur];
  const d = s.solved || s.lost;
  document.querySelectorAll('.k').forEach(k => { if (k.dataset.k) k.disabled = d; });
}

function upPB() {
  const bar = document.getElementById('pbar');
  bar.innerHTML = '';
  for (let i = 0; i < ANSWERS.length; i++) {
    const d = document.createElement('div');
    d.className = 'pdot';
    if (state[i].solved) d.classList.add('win');
    else if (state[i].lost) d.classList.add('lose');
    if (i === cur) d.classList.add('cur');
    d.textContent = i + 1;
    d.onclick = () => go(i);
    bar.appendChild(d);
  }
}

function upStats() {
  const solved = state.filter(s => s.solved).length;
  document.getElementById('sc').textContent = solved;
  let str = 0;
  for (let i = 0; i < state.length; i++) { if (state[i].solved) str++; else break; }
  document.getElementById('str').textContent = str;
  document.getElementById('stats').classList.toggle('show', solved > 0);
}

function upNav() {
  document.getElementById('prevBtn').disabled = cur <= 0;
  document.getElementById('nextBtn').disabled = cur >= ANSWERS.length - 1;
}

function go(idx) {
  if (idx < 0 || idx >= ANSWERS.length) return;
  cur = idx; guess = '';
  render();
}

function addLetter(l) {
  const s = state[cur];
  if (s.solved || s.lost) return;
  if (guess.length >= L) {
    // Shake the current row
    if (shakeTimer) clearTimeout(shakeTimer);
    const tiles = document.getElementById(`r${row}`).querySelectorAll('.tile');
    tiles.forEach(t => t.classList.add('bounce'));
    shakeTimer = setTimeout(() => tiles.forEach(t => t.classList.remove('bounce')), 600);
    return;
  }
  guess += l;
  render();
}

function delLetter() {
  const s = state[cur];
  if (s.solved || s.lost) return;
  if (guess.length > 0) guess = guess.slice(0, -1);
  render();
}

function submit() {
  const s = state[cur];
  if (s.solved || s.lost) return;
  if (guess.length !== L) {
    showMsg('Not enough letters', true);
    return;
  }

  // MUST be a valid English word
  if (!VALID.has(guess.toUpperCase())) {
    showMsg('Not in word list', true);
    // shake
    if (shakeTimer) clearTimeout(shakeTimer);
    const tiles = document.getElementById(`r${row}`).querySelectorAll('.tile');
    tiles.forEach(t => t.classList.add('bounce'));
    shakeTimer = setTimeout(() => tiles.forEach(t => t.classList.remove('bounce')), 600);
    return;
  }

  const target = ANSWERS[cur];
  // Evaluate: green = correct pos, yellow = wrong pos but in word, absent = not in word
  const targetChars = target.split('');
  const guessChars = guess.toUpperCase().split('');
  const result = Array(L).fill('a');

  // Pass 1: exact matches
  for (let i = 0; i < L; i++) {
    if (guessChars[i] === targetChars[i]) {
      result[i] = 'c';
      targetChars[i] = null;
      guessChars[i] = null;
    }
  }
  // Pass 2: present (wrong position)
  for (let i = 0; i < L; i++) {
    if (guessChars[i] === null) continue;
    const idx = targetChars.indexOf(guessChars[i]);
    if (idx !== -1) {
      result[i] = 'p';
      targetChars[idx] = null;
    }
  }

  // Animate
  const tiles = document.getElementById(`r${row}`).querySelectorAll('.tile');
  for (let i = 0; i < L; i++) {
    setTimeout(() => {
      tiles[i].textContent = guessChars[i] || guess[i];
      tiles[i].className = `tile ${result[i]} filled flip`;
    }, i * 120);
  }

  // Store guess
  const guessUp = guess.toUpperCase();
  s.guesses.push(guessUp);
  s.results.push(result);

  // Update keyboard
  const kb = s.kb;
  for (let i = 0; i < L; i++) {
    const letter = guessUp[i];
    if (result[i] === 'c') kb[letter] = 'c';
    else if (result[i] === 'p' && kb[letter] !== 'c') kb[letter] = 'p';
    else if (!kb[letter]) kb[letter] = 'a';
  }

  guess = '';

  const win = result.every(r => r === 'c');
  if (win) {
    s.solved = true;
    done = true;
    setTimeout(() => { showMsg('&#127942;!', false); render(); saveGame(); allDone(); }, L*120+200);
  } else {
    row++;
    if (row >= N) {
      s.lost = true;
      done = true;
      setTimeout(() => { render(); saveGame(); }, L*120+200);
    } else {
      setTimeout(() => { render(); saveGame(); }, L*120+50);
    }
  }
}

function allDone() {
  if (state.every(s => s.solved)) {
    setTimeout(() => document.getElementById('cov').classList.add('show'), 300);
  }
}

function cReset() {
  document.getElementById('cov').classList.remove('show');
  initGame(); saveGame(); render();
}

function showMsg(t, err) {
  const m = document.getElementById('msg');
  m.innerHTML = t;
  m.className = 'msg' + (err ? ' err' : ' ok');
  if (!err) setTimeout(() => { m.className = 'msg'; m.innerHTML = '&nbsp;'; }, 2500);
}

// ---------------------------------------------------------------------------
// EVENTS
// ---------------------------------------------------------------------------
document.querySelectorAll('.k').forEach(k => {
  if (!k.dataset.k) return;
  k.addEventListener('click', () => {
    const key = k.dataset.k;
    if (key === 'enter') submit();
    else if (key === 'del') delLetter();
    else addLetter(key.toLowerCase());
  });
});

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') { e.preventDefault(); submit(); }
  else if (e.key === 'Backspace') { e.preventDefault(); delLetter(); }
  else if (e.key.match(/^[a-z]$/i)) { addLetter(e.key.toLowerCase()); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(cur+1); }
});

document.getElementById('prevBtn').addEventListener('click', () => go(cur-1));
document.getElementById('nextBtn').addEventListener('click', () => go(cur+1));

// Disable touch events that cause weird behavior
document.addEventListener('touchstart', e => {
  if (e.target.closest('.k')) return;
}, {passive: true});

// ---------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------
if (!loadGame()) initGame();
build();
render();
saveGame();
</script>
